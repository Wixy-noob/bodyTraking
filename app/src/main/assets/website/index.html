<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Body Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --hud-dark: rgba(9, 13, 22, 0.88);
      --hud-border: rgba(0, 240, 255, 0.28);
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --amber: #ffb703;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Share Tech Mono', monospace, sans-serif;
      color: var(--text);
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Video element for Front Camera */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
      z-index: 0;
    }

    /* Primary AR Drawing Canvas */
    #arCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Layer (Edge-to-Edge like Compose Scaffold) */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 16px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* TOP BAR: TrackingStatusHud on Left, ArmorHudButton on Right */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    /* Top Left: TrackingStatusHud */
    .tracking-status-hud {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--hud-dark);
      border: 1px solid var(--hud-border);
      border-radius: 10px;
      padding: 8px 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    .status-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
      animation: radar-pulse 1.4s infinite ease-in-out;
    }

    .status-indicator-dot.scanning {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    @keyframes radar-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    .status-text-box {
      display: flex;
      flex-direction: column;
    }

    .status-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--neon-green);
    }

    .status-title.scanning {
      color: var(--amber);
    }

    .status-subtitle {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    /* Top Right: ArmorHudButton */
    .armor-hud-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--hud-dark);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(12px);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .armor-hud-btn:active {
      transform: scale(0.96);
    }

    .armor-hud-btn.open {
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .armor-btn-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .armor-btn-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }

    .armor-btn-sub {
      font-size: 9px;
      font-weight: 600;
      color: var(--neon-cyan);
    }

    /* NOTIFICATION BANNER (Holographic pill dropped from top) */
    .hud-notification-banner {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(9, 13, 22, 0.94);
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 24px rgba(0, 240, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 25;
    }

    .hud-notification-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hud-notification-banner span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    /* CENTER: BodyTargetingReticle (When waiting for body) */
    .center-reticle-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(9, 13, 22, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 16px;
      padding: 16px 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      z-index: 8;
      max-width: 90%;
    }

    .center-reticle-box.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .reticle-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .reticle-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
      animation: radar-pulse 1.2s infinite ease-in-out;
    }

    .reticle-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--amber);
    }

    .reticle-sub {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* BOTTOM CONTROLS BAR: Floating Glass Pill */
    .bottom-bar-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-bottom: 8px;
      z-index: 15;
    }

    .hud-controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--hud-dark);
      border: 1px solid var(--hud-border);
      border-radius: 24px;
      padding: 6px 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
    }

    .hud-chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 6px 11px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hud-chip-btn:active {
      transform: scale(0.95);
    }

    .hud-chip-btn.active-cyan {
      background: rgba(0, 240, 255, 0.2);
      border-color: rgba(0, 240, 255, 0.7);
      color: var(--neon-cyan);
    }

    .hud-chip-btn.active-green {
      background: rgba(0, 255, 102, 0.2);
      border-color: rgba(0, 255, 102, 0.6);
      color: var(--neon-green);
    }

    .hud-chip-btn.subtle {
      background: rgba(255, 255, 255, 0.08);
      color: var(--neon-cyan);
    }

    .hud-chip-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* ARMOR SELECTOR DRAWER (Identical to Android APK ArmorSelectorPanel) */
    .armor-drawer-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .armor-drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .armor-drawer-card {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #090e18 0%, #020617 100%);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 28px 20px;
      box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.06);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.18, 0.9, 0.28, 1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .armor-drawer-backdrop.open .armor-drawer-card {
      transform: translateY(0);
    }

    /* Drawer Header */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .drawer-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-title-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon-cyan);
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
    }

    .drawer-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Carousel Nav */
    .drawer-carousel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 6px 10px;
    }

    .drawer-arrow-btn {
      background: transparent;
      border: none;
      color: var(--neon-cyan);
      font-size: 18px;
      font-weight: bold;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drawer-armor-info {
      text-align: center;
    }

    .drawer-armor-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }

    .drawer-armor-category {
      font-size: 10px;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    /* Preview Card */
    .drawer-preview-card {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.35);
      background: #0d1322;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .drawer-preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .drawer-preview-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, transparent 40%, rgba(2, 6, 23, 0.85) 75%, rgba(2, 6, 23, 0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 14px;
    }

    /* Stats inside preview */
    .drawer-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .stat-box {
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 8.5px;
      color: var(--text-dim);
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    /* Action Button (EQUIP / UNEQUIP) */
    .drawer-equip-btn {
      width: 100%;
      background: linear-gradient(90deg, #00b4d8 0%, #00f0ff 100%);
      color: #030712;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .drawer-equip-btn:active {
      transform: scale(0.98);
    }

    .drawer-equip-btn.dark-knight {
      background: linear-gradient(90deg, #475569 0%, #cbd5e1 100%);
      box-shadow: 0 4px 20px rgba(203, 213, 225, 0.3);
    }

    .drawer-equip-btn.unequip {
      background: rgba(255, 255, 255, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: none;
    }

    /* Laser scanline animation overlay */
    #scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
      display: none;
    }

    .laser-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan), 0 0 32px var(--neon-cyan);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Webcam video element -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Vector AR Canvas -->
    <canvas id="arCanvas"></canvas>

    <!-- Laser Scanline VFX overlay -->
    <div id="scan-overlay">
      <div class="laser-line" id="laserLine"></div>
    </div>

    <!-- Center Reticle (when searching for body) -->
    <div class="center-reticle-box" id="centerReticle">
      <div class="reticle-header">
        <div class="reticle-dot"></div>
        <div class="reticle-title">DETEKSI TUBUH REAL-TIME</div>
      </div>
      <div class="reticle-sub" id="reticleSub">Posisikan tubuh di depan kamera • Auto-Equip aktif</div>
    </div>

    <!-- Top Center Notification Banner -->
    <div class="hud-notification-banner" id="hudNotification">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#00f0ff" id="notifIcon"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      <span id="notifText">⚡ DETEKSI TUBUH: AUTO-EQUIP DARK KNIGHT</span>
    </div>

    <!-- Edge-to-Edge HUD Layer -->
    <div class="hud-layer">
      <!-- TOP BAR -->
      <div class="top-bar">
        <!-- Status Badge -->
        <div class="tracking-status-hud interactive">
          <div class="status-indicator-dot" id="statusDot"></div>
          <div class="status-text-box">
            <div class="status-title" id="statusTitle">BODY LOCK: ACTIVE</div>
            <div class="status-subtitle" id="statusSub">Confidence: 96%</div>
          </div>
        </div>

        <!-- Armor Menu Button -->
        <div class="armor-hud-btn interactive" id="btnArmorMenu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#00f0ff" id="armorBtnIcon"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
          <div class="armor-btn-text">
            <span class="armor-btn-label">ARMOR</span>
            <span class="armor-btn-sub" id="armorBtnSub">DARK KNIGHT</span>
          </div>
        </div>
      </div>

      <!-- BOTTOM TOOLBAR (Pill Bar) -->
      <div class="bottom-bar-container">
        <div class="hud-controls-bar interactive">
          <!-- Camera / Demo Mode Toggle -->
          <button class="hud-chip-btn" id="btnCamToggle">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <span id="camToggleLabel">FRONT CAM</span>
          </button>

          <!-- Auto-Equip Toggle -->
          <button class="hud-chip-btn active-cyan" id="btnAutoEquip">
            <svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.88 0-.33-.75-.31-.78C8.48 10.94 10.42 7.54 13.01 3h1l-1 7h3.51c.4 0 .62.19.4.66C12.97 17.55 11 21 11 21z"/></svg>
            <span id="autoEquipLabel">AUTO: ON</span>
          </button>

          <!-- Next Pose (Demo Stance Switcher) -->
          <button class="hud-chip-btn subtle" id="btnNextPose">
            <span>NEXT ▶</span>
          </button>

          <!-- Bones / Skeleton Toggle -->
          <button class="hud-chip-btn" id="btnBones">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <span>BONES</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ARMOR SELECTOR DRAWER -->
    <div class="armor-drawer-backdrop" id="armorDrawerBackdrop">
      <div class="armor-drawer-card">
        <!-- Header -->
        <div class="drawer-header">
          <div class="drawer-title-row">
            <div class="drawer-title-dot" id="drawerTitleDot"></div>
            <div class="drawer-title">[ ARMOR ]</div>
          </div>
          <button class="drawer-close-btn" id="btnCloseDrawer">✕</button>
        </div>

        <!-- Carousel Bar -->
        <div class="drawer-carousel">
          <button class="drawer-arrow-btn" id="btnPrevDrawer">◀</button>
          <div class="drawer-armor-info">
            <div class="drawer-armor-name" id="drawerArmorName">DARK KNIGHT</div>
            <div class="drawer-armor-category" id="drawerArmorCategory">GOTHIC MELEE</div>
          </div>
          <button class="drawer-arrow-btn" id="btnNextDrawer">▶</button>
        </div>

        <!-- Preview Card -->
        <div class="drawer-preview-card">
          <img id="drawerPreviewImg" src="assets/armor_dark_knight_preview.jpg" alt="Armor Preview" />
          <div class="drawer-preview-overlay">
            <div class="drawer-stats-row">
              <div class="stat-box">
                <div class="stat-label">DEFENSE</div>
                <div class="stat-val" id="drawerStatDef">95%</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">AGILITY</div>
                <div class="stat-val" id="drawerStatAgi">62%</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">POWER</div>
                <div class="stat-val" id="drawerStatPwr">92%</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Equip / Unequip Button -->
        <button class="drawer-equip-btn dark-knight" id="btnDrawerEquip">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          <span id="drawerEquipText">EQUIP DARK KNIGHT</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ARMOR DEFINITIONS
    // ==========================================
    const ARMOR_LIST = [
      {
        id: 'dark_knight',
        name: 'DARK KNIGHT',
        category: 'GOTHIC MELEE',
        preview: 'assets/armor_dark_knight_preview.jpg',
        themeColor: '#cbd5e1',
        accentColor: '#475569',
        glowColor: 'rgba(255, 255, 255, 0.25)',
        def: 95,
        agi: 62,
        pwr: 92
      },
      {
        id: 'cyber_knight',
        name: 'CYBER KNIGHT',
        category: 'HIGH-TECH ASSAULT',
        preview: 'assets/armor_cyber_knight_preview.jpg',
        themeColor: '#00f0ff',
        accentColor: '#00b4d8',
        glowColor: 'rgba(0, 240, 255, 0.6)',
        def: 86,
        agi: 96,
        pwr: 89
      }
    ];

    // App States
    let currentArmorIndex = 0;
    let isEquipped = true;
    let isEquipScanning = false;
    let autoEquipEnabled = true;
    let showSkeleton = false;
    let isDemoMode = false;
    let isCameraActive = false;
    let isDrawerOpen = false;

    let scanProgress = 1.0;
    let scanStartTime = 0;
    const SCAN_DURATION = 1600;

    let poseModeIndex = 0;
    const POSE_MODES = ['IDLE', 'COMBAT', 'WAVE', 'WALK'];

    // Procedural Audio Synthesizer (Zero external mp3 dependencies)
    let audioCtx = null;
    function playAudio(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'equip') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 1.2);
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.2, now + 0.3);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.5);

          setTimeout(() => {
            if (!audioCtx) return;
            const clank = audioCtx.createOscillator();
            const clankGain = audioCtx.createGain();
            clank.type = 'triangle';
            clank.frequency.setValueAtTime(320, audioCtx.currentTime);
            clank.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
            clankGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            clankGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            clank.connect(clankGain);
            clankGain.connect(audioCtx.destination);
            clank.start();
            clank.stop(audioCtx.currentTime + 0.3);
          }, 1200);
        } else if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {
        // audio muted or unsupported
      }
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();
        isCameraActive = true;
        isDemoMode = false;
        video.style.display = 'block';
        camToggleLabel.textContent = 'FRONT CAM';
        btnCamToggle.classList.add('active-cyan');
        statusTitle.textContent = 'BODY LOCK: ACTIVE';
        statusTitle.classList.remove('scanning');
        statusDot.classList.remove('scanning');
        statusSub.textContent = 'Live Webcam AR Active';
        centerReticle.classList.add('hidden');
        if (autoEquipEnabled) {
          triggerAutoEquip();
        }
      } catch (err) {
        console.warn('Camera access fallback to Virtual Pose:', err);
        fallbackToDemoMode();
      }
    }

    function stopWebcam() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());

    // ==========================================
    // CANVAS & 60FPS AR RENDER ENGINE
    // ==========================================
    const canvas = document.getElementById('arCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Body Landmark Kinematics Generator
    function getPoseLandmarks(time) {
      const t = time * 0.001;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w * 0.5;
      const cy = h * 0.52;
      const scale = Math.min(w, h) * 0.72;

      let headY = cy - scale * 0.44;
      let leftShoulderX = cx - scale * 0.18;
      let rightShoulderX = cx + scale * 0.18;
      let shoulderY = cy - scale * 0.28;

      let leftElbowX = cx - scale * 0.26;
      let leftElbowY = cy - scale * 0.12;
      let leftWristX = cx - scale * 0.28;
      let leftWristY = cy + scale * 0.04;

      let rightElbowX = cx + scale * 0.26;
      let rightElbowY = cy - scale * 0.12;
      let rightWristX = cx + scale * 0.28;
      let rightWristY = cy + scale * 0.04;

      let leftHipX = cx - scale * 0.12;
      let rightHipX = cx + scale * 0.12;
      let hipY = cy + scale * 0.06;

      let leftKneeX = cx - scale * 0.13;
      let leftKneeY = cy + scale * 0.26;
      let rightKneeX = cx + scale * 0.13;
      let rightKneeY = cy + scale * 0.26;

      let leftAnkleX = cx - scale * 0.14;
      let leftAnkleY = cy + scale * 0.46;
      let rightAnkleX = cx + scale * 0.14;
      let rightAnkleY = cy + scale * 0.46;

      // Natural breathing sway
      const breath = Math.sin(t * 2) * (scale * 0.008);
      shoulderY += breath;
      headY += breath * 0.8;

      const mode = POSE_MODES[poseModeIndex];
      if (mode === 'WAVE') {
        rightElbowY = cy - scale * 0.32;
        rightElbowX = cx + scale * 0.30;
        rightWristX = cx + scale * (0.32 + Math.sin(t * 5) * 0.08);
        rightWristY = cy - scale * (0.45 + Math.cos(t * 5) * 0.03);
      } else if (mode === 'COMBAT') {
        leftElbowX = cx - scale * 0.12;
        leftElbowY = cy - scale * 0.16;
        leftWristX = cx + scale * 0.02;
        leftWristY = cy - scale * 0.20;

        rightElbowX = cx + scale * 0.14;
        rightElbowY = cy - scale * 0.14;
        rightWristX = cx + scale * 0.06;
        rightWristY = cy - scale * 0.22;

        leftKneeX = cx - scale * 0.18;
        rightKneeX = cx + scale * 0.18;
      } else if (mode === 'WALK') {
        const walkSin = Math.sin(t * 3.5);
        leftKneeY += walkSin * (scale * 0.04);
        rightKneeY -= walkSin * (scale * 0.04);
        leftAnkleY += walkSin * (scale * 0.05);
        rightAnkleY -= walkSin * (scale * 0.05);
        leftWristY += walkSin * (scale * 0.06);
        rightWristY -= walkSin * (scale * 0.06);
      }

      return {
        nose: { x: cx, y: headY },
        leftShoulder: { x: leftShoulderX, y: shoulderY },
        rightShoulder: { x: rightShoulderX, y: shoulderY },
        leftElbow: { x: leftElbowX, y: leftElbowY },
        rightElbow: { x: rightElbowX, y: rightElbowY },
        leftWrist: { x: leftWristX, y: leftWristY },
        rightWrist: { x: rightWristX, y: rightWristY },
        leftHip: { x: leftHipX, y: hipY },
        rightHip: { x: rightHipX, y: hipY },
        leftKnee: { x: leftKneeX, y: leftKneeY },
        rightKnee: { x: rightKneeX, y: rightKneeY },
        leftAnkle: { x: leftAnkleX, y: leftAnkleY },
        rightAnkle: { x: rightAnkleX, y: rightAnkleY },
        scale: scale
      };
    }

    // ==========================================
    // ANATOMICAL FIT ARTWORK PIPELINE
    // ("Kayak pake armor asli")
    // ==========================================
    function drawLimbSegment(ctx, p1, p2, width, fill, stroke, scanCutoff) {
      const midY = (p1.y + p2.y) * 0.5;
      if (midY < scanCutoff) return;

      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.roundRect(0, -width * 0.5, len, width, width * 0.3);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Anatomical Undersuit: forms the base compression suit so armor fits physically
    function drawAnatomicalUndersuit(ctx, pose, isCyber, scanCutoff) {
      const { leftShoulder, rightShoulder, leftElbow, rightElbow, leftWrist, rightWrist, leftHip, rightHip, leftKnee, rightKnee, leftAnkle, rightAnkle } = pose;
      const baseColor = isCyber ? '#090e18' : '#0a0d14';
      const seamColor = isCyber ? 'rgba(0, 240, 255, 0.4)' : '#1e293b';

      ctx.save();
      // 1. Torso compression glove
      if (leftShoulder.y >= scanCutoff) {
        ctx.fillStyle = baseColor;
        ctx.strokeStyle = seamColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(leftShoulder.x - 12, leftShoulder.y);
        ctx.lineTo(rightShoulder.x + 12, rightShoulder.y);
        ctx.lineTo(rightHip.x + 14, rightHip.y);
        ctx.lineTo(leftHip.x - 14, leftHip.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // 2. Arms & Legs body glove
      drawLimbSegment(ctx, leftShoulder, leftElbow, 24, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, rightShoulder, rightElbow, 24, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, leftElbow, leftWrist, 18, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, rightElbow, rightWrist, 18, baseColor, seamColor, scanCutoff);

      drawLimbSegment(ctx, leftHip, leftKnee, 26, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, rightHip, rightKnee, 26, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, leftKnee, leftAnkle, 20, baseColor, seamColor, scanCutoff);
      drawLimbSegment(ctx, rightKnee, rightAnkle, 20, baseColor, seamColor, scanCutoff);
      ctx.restore();
    }

    // Neck Gorget Collar: anchors armor plates between chest and helmet
    function drawNeckGorget(ctx, leftShoulder, rightShoulder, nose, isCyber, scanCutoff) {
      const midShoulderX = (leftShoulder.x + rightShoulder.x) * 0.5;
      const midShoulderY = (leftShoulder.y + rightShoulder.y) * 0.5;
      const neckY = midShoulderY - (midShoulderY - nose.y) * 0.45;
      if (neckY < scanCutoff) return;

      const w = Math.abs(rightShoulder.x - leftShoulder.x) * 0.38;
      ctx.save();
      ctx.fillStyle = isCyber ? '#1e293b' : '#1e222d';
      ctx.strokeStyle = isCyber ? '#00f0ff' : '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(midShoulderX - w * 0.5, midShoulderY);
      ctx.lineTo(midShoulderX + w * 0.5, midShoulderY);
      ctx.lineTo(midShoulderX + w * 0.35, neckY);
      ctx.lineTo(midShoulderX - w * 0.35, neckY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ARMOR 1: DARK KNIGHT (Gothic Fantasy Steel, Cowl, Flowing Cape, Greatsword)
    function drawDarkKnight(ctx, pose, time, scanCutoff) {
      const t = time * 0.001;
      const { nose, leftShoulder, rightShoulder, leftElbow, rightElbow, leftWrist, rightWrist, leftHip, rightHip, leftKnee, rightKnee, leftAnkle, rightAnkle, scale } = pose;

      const chestX = (leftShoulder.x + rightShoulder.x) * 0.5;
      const chestY = (leftShoulder.y + leftHip.y) * 0.5;
      const hipMidX = (leftHip.x + rightHip.x) * 0.5;
      const hipMidY = (leftHip.y + rightHip.y) * 0.5;

      // 0. Anatomical Undersuit
      drawAnatomicalUndersuit(ctx, pose, false, scanCutoff);

      // 1. Flowing Midnight Cape
      if (leftShoulder.y >= scanCutoff) {
        ctx.save();
        ctx.fillStyle = '#0f1117';
        ctx.beginPath();
        ctx.moveTo(leftShoulder.x - 10, leftShoulder.y);
        ctx.lineTo(rightShoulder.x + 10, rightShoulder.y);
        const capeBottomY = leftAnkle.y - 20;
        const wave1 = Math.sin(t * 3) * 20;
        const wave2 = Math.cos(t * 2.5) * 25;
        ctx.quadraticCurveTo(rightShoulder.x + 50 + wave1, hipMidY + 50, rightShoulder.x + 60 + wave2, capeBottomY);
        ctx.lineTo(leftShoulder.x - 60 + wave1, capeBottomY);
        ctx.quadraticCurveTo(leftShoulder.x - 50 + wave2, hipMidY + 50, leftShoulder.x - 10, leftShoulder.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#2d3342';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // 2. Gothic Greatsword on Back
      if (nose.y >= scanCutoff) {
        ctx.save();
        ctx.translate(chestX + 25, chestY - 40);
        ctx.rotate(-0.4);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(-6, -scale * 0.45, 12, scale * 0.5);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-2, -scale * 0.42, 4, scale * 0.45);
        ctx.fillStyle = '#475569';
        ctx.fillRect(-25, scale * 0.05, 50, 10);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4, scale * 0.07, 8, 30);
        ctx.beginPath();
        ctx.arc(0, scale * 0.07 + 34, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb300';
        ctx.fill();
        ctx.restore();
      }

      // 3. Leg Greaves
      drawLimbSegment(ctx, leftKnee, leftAnkle, 18, '#1e222d', '#94a3b8', scanCutoff);
      drawLimbSegment(ctx, rightKnee, rightAnkle, 18, '#1e222d', '#94a3b8', scanCutoff);
      drawLimbSegment(ctx, leftHip, leftKnee, 22, '#181b24', '#64748b', scanCutoff);
      drawLimbSegment(ctx, rightHip, rightKnee, 22, '#181b24', '#64748b', scanCutoff);

      // 4. Gothic Cuirass
      if (chestY >= scanCutoff) {
        ctx.save();
        const grad = ctx.createLinearGradient(leftShoulder.x, leftShoulder.y, rightShoulder.x, hipMidY);
        grad.addColorStop(0, '#334155');
        grad.addColorStop(0.5, '#0f172a');
        grad.addColorStop(1, '#1e293b');
        ctx.fillStyle = grad;
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(leftShoulder.x, leftShoulder.y);
        ctx.lineTo(rightShoulder.x, rightShoulder.y);
        ctx.lineTo(rightHip.x + 10, rightHip.y);
        ctx.lineTo(hipMidX, hipMidY + 25);
        ctx.lineTo(leftHip.x - 10, leftHip.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(chestX, leftShoulder.y);
        ctx.lineTo(chestX, hipMidY + 20);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(chestX, chestY - 10, 14, 0, Math.PI * 2);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // 5. Spiked Multi-tiered Pauldrons
      if (leftShoulder.y >= scanCutoff) {
        drawSpikedPauldron(ctx, leftShoulder.x, leftShoulder.y, -1);
        drawSpikedPauldron(ctx, rightShoulder.x, rightShoulder.y, 1);
      }

      // 6. Arm Vambraces & Gauntlets
      drawLimbSegment(ctx, leftShoulder, leftElbow, 16, '#1e222d', '#94a3b8', scanCutoff);
      drawLimbSegment(ctx, rightShoulder, rightElbow, 16, '#1e222d', '#94a3b8', scanCutoff);
      drawLimbSegment(ctx, leftElbow, leftWrist, 14, '#334155', '#e2e8f0', scanCutoff);
      drawLimbSegment(ctx, rightElbow, rightWrist, 14, '#334155', '#e2e8f0', scanCutoff);

      // 6.5 Neck Gorget
      drawNeckGorget(ctx, leftShoulder, rightShoulder, nose, false, scanCutoff);

      // 7. Dark Midnight Cowl & Gothic Helmet
      if (nose.y >= scanCutoff) {
        ctx.save();
        const headRadius = scale * 0.11;
        ctx.fillStyle = '#0f1117';
        ctx.beginPath();
        ctx.moveTo(nose.x - headRadius * 1.3, nose.y + headRadius * 0.8);
        ctx.lineTo(nose.x, nose.y - headRadius * 1.55);
        ctx.lineTo(nose.x + headRadius * 1.3, nose.y + headRadius * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(nose.x, nose.y, headRadius * 0.85, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eye Slit Visor
        ctx.fillStyle = '#000000';
        ctx.fillRect(nose.x - headRadius * 0.5, nose.y - 4, headRadius, 7);
        ctx.fillStyle = '#ffb300';
        ctx.shadowColor = '#ffb300';
        ctx.shadowBlur = 10;
        ctx.fillRect(nose.x - headRadius * 0.35, nose.y - 2, headRadius * 0.7, 3);
        ctx.restore();
      }
    }

    function drawSpikedPauldron(ctx, x, y, dir) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(35 * dir, -20);
      ctx.lineTo(45 * dir, 10);
      ctx.lineTo(10 * dir, 30);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(25 * dir, -15);
      ctx.lineTo(55 * dir, -35);
      ctx.lineTo(40 * dir, -10);
      ctx.fillStyle = '#cbd5e1';
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ARMOR 2: CYBER KNIGHT (Ceramic Exosuit, Cyan Conduits, Arc Reactor, V-Visor)
    function drawCyberKnight(ctx, pose, time, scanCutoff) {
      const t = time * 0.001;
      const { nose, leftShoulder, rightShoulder, leftElbow, rightElbow, leftWrist, rightWrist, leftHip, rightHip, leftKnee, rightKnee, leftAnkle, rightAnkle, scale } = pose;

      const chestX = (leftShoulder.x + rightShoulder.x) * 0.5;
      const chestY = (leftShoulder.y + leftHip.y) * 0.5;
      const hipMidX = (leftHip.x + rightHip.x) * 0.5;
      const hipMidY = (leftHip.y + rightHip.y) * 0.5;

      // 0. Anatomical Nano-Suit
      drawAnatomicalUndersuit(ctx, pose, true, scanCutoff);

      // 1. Ceramic Exosuit Legs
      drawCyberLimb(ctx, leftKnee, leftAnkle, 20, scanCutoff, t);
      drawCyberLimb(ctx, rightKnee, rightAnkle, 20, scanCutoff, t);
      drawCyberLimb(ctx, leftHip, leftKnee, 24, scanCutoff, t);
      drawCyberLimb(ctx, rightHip, rightKnee, 24, scanCutoff, t);

      // 2. Torso Exosuit & Arc Reactor
      if (chestY >= scanCutoff) {
        ctx.save();
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(leftShoulder.x - 5, leftShoulder.y);
        ctx.lineTo(rightShoulder.x + 5, rightShoulder.y);
        ctx.lineTo(rightHip.x + 8, rightHip.y);
        ctx.lineTo(hipMidX, hipMidY + 15);
        ctx.lineTo(leftHip.x - 8, leftHip.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(chestX - 25, chestY - 15);
        ctx.lineTo(chestX + 25, chestY - 15);
        ctx.lineTo(chestX + 15, chestY + 25);
        ctx.lineTo(chestX - 15, chestY + 25);
        ctx.closePath();
        ctx.fill();

        // Pulsing Arc Reactor
        const pulse = 1 + Math.sin(t * 6) * 0.15;
        const reactorRadius = 16 * pulse;
        ctx.beginPath();
        ctx.arc(chestX, chestY - 5, reactorRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 24;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(chestX, chestY - 5, reactorRadius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(chestX, chestY - 5);
        ctx.lineTo(leftShoulder.x, leftShoulder.y);
        ctx.moveTo(chestX, chestY - 5);
        ctx.lineTo(rightShoulder.x, rightShoulder.y);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      // 3. Cyber Pauldrons
      if (leftShoulder.y >= scanCutoff) {
        drawCyberPauldron(ctx, leftShoulder.x, leftShoulder.y, -1, t);
        drawCyberPauldron(ctx, rightShoulder.x, rightShoulder.y, 1, t);
      }

      // 4. Arms & Gauntlets
      drawCyberLimb(ctx, leftShoulder, leftElbow, 18, scanCutoff, t);
      drawCyberLimb(ctx, rightShoulder, rightElbow, 18, scanCutoff, t);
      drawCyberLimb(ctx, leftElbow, leftWrist, 16, scanCutoff, t);
      drawCyberLimb(ctx, rightElbow, rightWrist, 16, scanCutoff, t);

      // 4.5 Neck Gorget
      drawNeckGorget(ctx, leftShoulder, rightShoulder, nose, true, scanCutoff);

      // 5. Aerodynamic Helmet & Glowing Cyan Chevron V-Visor
      if (nose.y >= scanCutoff) {
        ctx.save();
        const headRadius = scale * 0.11;
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(nose.x, nose.y, headRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(nose.x - headRadius - 8, nose.y - 12, 10, 24);
        ctx.fillRect(nose.x + headRadius - 2, nose.y - 12, 10, 24);

        // Glowing Chevron V-Visor
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.moveTo(nose.x - headRadius * 0.65, nose.y - 10);
        ctx.lineTo(nose.x, nose.y + headRadius * 0.25);
        ctx.lineTo(nose.x + headRadius * 0.65, nose.y - 10);
        ctx.lineTo(nose.x + headRadius * 0.5, nose.y - 14);
        ctx.lineTo(nose.x, nose.y);
        ctx.lineTo(nose.x - headRadius * 0.5, nose.y - 14);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function drawCyberLimb(ctx, p1, p2, width, scanCutoff, t) {
      const midY = (p1.y + p2.y) * 0.5;
      if (midY < scanCutoff) return;

      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
      ctx.shadowBlur = 6;

      ctx.beginPath();
      ctx.roundRect(0, -width * 0.5, len, width, 6);
      ctx.fill();
      ctx.stroke();

      // Pulsing cyan energy stripe
      const stripePulse = 0.5 + Math.sin(t * 8) * 0.5;
      ctx.fillStyle = `rgba(0, 240, 255, ${0.4 + stripePulse * 0.6})`;
      ctx.fillRect(len * 0.2, -1.5, len * 0.6, 3);
      ctx.restore();
    }

    function drawCyberPauldron(ctx, x, y, dir, t) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(40 * dir, -25);
      ctx.lineTo(55 * dir, 5);
      ctx.lineTo(15 * dir, 25);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(15 * dir, -10, 20 * dir, 3);
      ctx.restore();
    }

    // Skeleton Bones Overlay
    function drawSkeleton(ctx, pose) {
      ctx.save();
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffffff';

      const joints = [
        pose.nose, pose.leftShoulder, pose.rightShoulder,
        pose.leftElbow, pose.rightElbow, pose.leftWrist, pose.rightWrist,
        pose.leftHip, pose.rightHip, pose.leftKnee, pose.rightKnee,
        pose.leftAnkle, pose.rightAnkle
      ];

      const bones = [
        [pose.leftShoulder, pose.rightShoulder],
        [pose.leftShoulder, pose.leftElbow],
        [pose.leftElbow, pose.leftWrist],
        [pose.rightShoulder, pose.rightElbow],
        [pose.rightElbow, pose.rightWrist],
        [pose.leftShoulder, pose.leftHip],
        [pose.rightShoulder, pose.rightHip],
        [pose.leftHip, pose.rightHip],
        [pose.leftHip, pose.leftKnee],
        [pose.leftKnee, pose.leftAnkle],
        [pose.rightHip, pose.rightKnee],
        [pose.rightKnee, pose.rightAnkle]
      ];

      bones.forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });

      joints.forEach(j => {
        ctx.beginPath();
        ctx.arc(j.x, j.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    // ==========================================
    // MAIN 60 FPS RENDER LOOP
    // ==========================================
    function renderLoop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw live camera video feed if active
      if (isCameraActive && video.readyState >= 2) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        // Holographic Holodeck sci-fi backdrop (when demo mode)
        ctx.save();
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.lineWidth = 1;
        const gridY = canvas.height * 0.76;
        for (let i = -10; i <= 10; i++) {
          ctx.beginPath();
          ctx.moveTo(canvas.width * 0.5 + i * 40, gridY);
          ctx.lineTo(canvas.width * 0.5 + i * 180, canvas.height);
          ctx.stroke();
        }
        for (let y = gridY; y <= canvas.height; y += 22) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 2. Obtain Body Kinematics
      const pose = getPoseLandmarks(now);

      // 3. Feet-to-Head Laser Scanline Animation
      let scanCutoffY = 0;
      if (isEquipScanning) {
        const elapsed = now - scanStartTime;
        const progress = Math.min(1.0, elapsed / SCAN_DURATION);
        const feetY = pose.leftAnkle.y + 40;
        const headTopY = pose.nose.y - pose.scale * 0.2;
        scanCutoffY = feetY - (feetY - headTopY) * progress;

        const laserLine = document.getElementById('laserLine');
        laserLine.style.top = scanCutoffY + 'px';

        ctx.save();
        ctx.fillStyle = ARMOR_LIST[currentArmorIndex].id === 'cyber_knight' ? 'rgba(0, 240, 255, 0.18)' : 'rgba(203, 213, 225, 0.18)';
        ctx.fillRect(0, scanCutoffY, canvas.width, canvas.height - scanCutoffY);

        ctx.strokeStyle = ARMOR_LIST[currentArmorIndex].id === 'cyber_knight' ? '#00f0ff' : '#cbd5e1';
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 18;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, scanCutoffY);
        ctx.lineTo(canvas.width, scanCutoffY);
        ctx.stroke();
        ctx.restore();

        if (progress >= 1.0) {
          isEquipScanning = false;
          document.getElementById('scan-overlay').style.display = 'none';
          showNotification(`✅ ARMOR RIGGED TO BODY • ${ARMOR_LIST[currentArmorIndex].name}`);
        }
      }

      // 4. Render Wearable Armor
      if (isEquipped) {
        const armor = ARMOR_LIST[currentArmorIndex];
        if (armor.id === 'dark_knight') {
          drawDarkKnight(ctx, pose, now, scanCutoffY);
        } else {
          drawCyberKnight(ctx, pose, now, scanCutoffY);
        }
      }

      // 5. Render Skeleton if toggled
      if (showSkeleton) {
        drawSkeleton(ctx, pose);
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);

    // Initial setup on start
    updateDrawerUI();
    setTimeout(() => {
      triggerAutoEquip();
    }, 500);
  </script>
</body>
